# inlinePatches under kustomizationObservations records per-env
# controller value overrides the v1 export does not preserve as
# separate overlays (ADR-017 Negative consequences).
# discoveryFailures records inventory entries the walk found but
# could not fetch — surfacing the loud-on-silent-drop guarantee
# so missing items are operator-visible instead of disappearing.
# pathCollisions records two or more distinct objects resolving to
# the same emitted path — defense in depth against silent overwrite.
# Empty pathCollisions means every emitted path is unique.
