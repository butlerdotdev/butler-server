InventoryWalk:
  FetchFailures: null
  Items:
  - APIVersion: v1
    IsNamespaced: false
    Kind: Namespace
    Name: loki
    Namespace: ""
    Object:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: loki
  - APIVersion: v1
    IsNamespaced: true
    Kind: Service
    Name: loki-gateway-lb
    Namespace: loki
    Object:
      apiVersion: v1
      kind: Service
      metadata:
        annotations:
          metallb.io/ip-allocated-from-pool: default-pool
        name: loki-gateway-lb
        namespace: loki
      spec:
        allocateLoadBalancerNodePorts: true
        clusterIP: 10.99.3.176
        clusterIPs:
        - 10.99.3.176
        externalTrafficPolicy: Cluster
        internalTrafficPolicy: Cluster
        ipFamilies:
        - IPv4
        ipFamilyPolicy: SingleStack
        ports:
        - name: http
          nodePort: 32260
          port: 3100
          protocol: TCP
          targetPort: 8080
        selector:
          app.kubernetes.io/component: gateway
          app.kubernetes.io/name: loki
        sessionAffinity: None
        type: LoadBalancer
  - APIVersion: bitnami.com/v1alpha1
    IsNamespaced: true
    Kind: SealedSecret
    Name: loki-gateway-tls
    Namespace: loki
    Object:
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: loki-gateway-tls
        namespace: loki
      spec:
        encryptedData:
          tls.crt: 
          tls.key: 
        template:
          metadata:
            name: loki-gateway-tls
            namespace: loki
          type: kubernetes.io/tls
  - APIVersion: bitnami.com/v1alpha1
    IsNamespaced: true
    Kind: SealedSecret
    Name: seaweedfs-s3-credentials
    Namespace: loki
    Object:
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: seaweedfs-s3-credentials
        namespace: loki
      spec:
        encryptedData:
          S3_ACCESS_KEY_ID: 
          S3_SECRET_ACCESS_KEY: 
        template:
          metadata:
            name: seaweedfs-s3-credentials
            namespace: loki
          type: Opaque
  - APIVersion: helm.toolkit.fluxcd.io/v2
    IsNamespaced: true
    Kind: HelmRelease
    Name: loki
    Namespace: loki
    Object:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: loki
        namespace: loki
      spec:
        chart:
          spec:
            chart: loki
            reconcileStrategy: ChartVersion
            sourceRef:
              kind: HelmRepository
              name: grafana
              namespace: flux-system
            version: ~6.24.0
        dependsOn:
        - name: sealed-secrets
          namespace: flux-system
        install:
          createNamespace: true
          remediation:
            retries: 3
        interval: 1h0m0s
        releaseName: loki
        timeout: 15m0s
        upgrade:
          remediation:
            retries: 3
        values:
          backend:
            replicas: 0
          chunksCache:
            allocatedMemory: 8192
            enabled: true
            replicas: 3
            resources:
              limits:
                cpu: "1"
                memory: 12Gi
              requests:
                cpu: 250m
                memory: 2Gi
          compactor:
            extraArgs:
            - -config.expand-env=true
            extraEnvFrom:
            - secretRef:
                name: seaweedfs-s3-credentials
            persistence:
              claims:
              - name: data
                size: 10Gi
                storageClass: longhorn
              enabled: true
            replicas: 1
            resources:
              limits:
                cpu: "2"
                memory: 8Gi
              requests:
                cpu: 500m
                memory: 2Gi
          deploymentMode: Distributed
          distributor:
            extraArgs:
            - -config.expand-env=true
            extraEnvFrom:
            - secretRef:
                name: seaweedfs-s3-credentials
            maxUnavailable: 1
            replicas: 4
            resources:
              limits:
                cpu: "2"
                memory: 4Gi
              requests:
                cpu: 500m
                memory: 1Gi
          gateway:
            maxUnavailable: 1
            replicas: 2
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 250m
                memory: 256Mi
          indexGateway:
            extraArgs:
            - -config.expand-env=true
            extraEnvFrom:
            - secretRef:
                name: seaweedfs-s3-credentials
            maxUnavailable: 1
            persistence:
              enabled: true
              size: 10Gi
              storageClass: longhorn
            replicas: 2
            resources:
              limits:
                cpu: "1"
                memory: 4Gi
              requests:
                cpu: 500m
                memory: 2Gi
          ingester:
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                - podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                      - key: app.kubernetes.io/component
                        operator: In
                        values:
                        - ingester
                    topologyKey: kubernetes.io/hostname
                  weight: 100
            extraArgs:
            - -config.expand-env=true
            extraEnvFrom:
            - secretRef:
                name: seaweedfs-s3-credentials
            maxUnavailable: 1
            persistence:
              claims:
              - name: data
                size: 10Gi
                storageClass: longhorn
              enabled: true
            replicas: 3
            resources:
              limits:
                cpu: "4"
                memory: 16Gi
              requests:
                cpu: 2000m
                memory: 8Gi
            zoneAwareReplication:
              enabled: false
          loki:
            auth_enabled: true
            commonConfig:
              compactor_address: '{{ include "loki.compactorAddress" . }}'
              path_prefix: /var/loki
              replication_factor: 3
            compactor:
              compaction_interval: 10m
              delete_request_store: s3
              retention_delete_delay: 2h
              retention_delete_worker_count: 150
              retention_enabled: true
              working_directory: /var/loki/compactor
            ingester:
              chunk_encoding: snappy
              chunk_target_size: 1572864
              concurrent_flushes: 64
              max_chunk_age: 2h
            limits_config:
              ingestion_burst_size_mb: 75
              ingestion_rate_mb: 50
              max_cache_freshness_per_query: 10m
              max_query_parallelism: 64
              max_streams_per_user: 50000
              per_stream_rate_limit: 25MB
              per_stream_rate_limit_burst: 50MB
              query_timeout: 300s
              reject_old_samples: true
              reject_old_samples_max_age: 168h
              retention_period: 168h
              split_queries_by_interval: 15m
              tsdb_max_query_parallelism: 128
              volume_enabled: true
            pattern_ingester:
              enabled: false
            querier:
              max_concurrent: 16
            schemaConfig:
              configs:
              - from: "2024-04-01"
                index:
                  period: 24h
                  prefix: loki_index_
                object_store: s3
                schema: v13
                store: tsdb
            server:
              grpc_listen_port: 9095
              http_listen_port: 3100
              http_server_read_timeout: 600s
              http_server_write_timeout: 600s
            storage:
              bucketNames:
                admin: loki-admin
                chunks: loki-chunks
                ruler: loki-ruler
              s3:
                accessKeyId: ${S3_ACCESS_KEY_ID}
                endpoint: https://s3-crop-dev.phibred.com
                http_config:
                  insecure_skip_verify: true
                insecure: false
                region: us-east-1
                s3ForcePathStyle: true
                secretAccessKey: ${S3_SECRET_ACCESS_KEY}
              type: s3
          lokiCanary:
            enabled: false
          querier:
            extraArgs:
            - -config.expand-env=true
            extraEnvFrom:
            - secretRef:
                name: seaweedfs-s3-credentials
            maxUnavailable: 1
            replicas: 3
            resources:
              limits:
                cpu: "2"
                memory: 8Gi
              requests:
                cpu: 500m
                memory: 2Gi
          queryFrontend:
            extraArgs:
            - -config.expand-env=true
            extraEnvFrom:
            - secretRef:
                name: seaweedfs-s3-credentials
            maxUnavailable: 1
            replicas: 2
            resources:
              limits:
                cpu: "1"
                memory: 4Gi
              requests:
                cpu: 500m
                memory: 2Gi
          queryScheduler:
            extraArgs:
            - -config.expand-env=true
            extraEnvFrom:
            - secretRef:
                name: seaweedfs-s3-credentials
            maxUnavailable: 1
            replicas: 2
            resources:
              limits:
                cpu: 500m
                memory: 2Gi
              requests:
                cpu: 250m
                memory: 1Gi
          read:
            replicas: 0
          resultsCache:
            allocatedMemory: 4096
            defaultValidity: 12h
            enabled: true
            replicas: 2
            resources:
              limits:
                cpu: "1"
                memory: 6Gi
              requests:
                cpu: 500m
                memory: 2Gi
          ruler:
            enabled: false
          singleBinary:
            replicas: 0
          test:
            enabled: false
          write:
            replicas: 0
