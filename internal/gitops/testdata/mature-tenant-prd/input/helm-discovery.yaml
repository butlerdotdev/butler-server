          - watch
    kubeStateMetrics:
      enabled: true
    nodeExporter:
      enabled: true
    prometheus:
      enabled: true
      prometheusSpec:
        externalLabels:
          cluster: mature-tenant-prd
        podMonitorSelectorNilUsesHelmValues: false
        remoteWrite:
        - name: vector-pipeline-prd
          url: http://vector.vector.svc:9000
        replicas: 1
        resources:
          limits:
            cpu: 2000m
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 2Gi
        retention: 2h
        securityContext:
          fsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
        serviceMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 50Gi
              storageClassName: longhorn
        walCompression: true
    prometheusOperator:
      admissionWebhooks:
        enabled: false
      resources:
        limits:
          cpu: 250m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
