              metrics:
              - each:
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                  type: Info
                help: The current state of a Flux ImageUpdateAutomation resource.
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  source_name:
                  - spec
                  - sourceRef
                  - name
                  suspended:
                  - spec
                  - suspend
                name: resource_info
        enabled: true
      rbac:
        extraRules:
        - apiGroups:
          - source.toolkit.fluxcd.io
          - kustomize.toolkit.fluxcd.io
          - helm.toolkit.fluxcd.io
          - notification.toolkit.fluxcd.io
          - image.toolkit.fluxcd.io
