apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
  namespace: vector
spec:
  chart:
    spec:
      chart: vector
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: vector-repo
        namespace: flux-system
      version: '*'
  install:
    createNamespace: true
  interval: 5m
  releaseName: vector
  targetNamespace: vector
