---
apiVersion: v1
kind: Namespace
metadata:
  name: reflector
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: emberstack
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/emberstack/kubernetes-reflector
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: reflector
spec:
  chart:
    spec:
      chart: reflector
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: flux-system
      version: 10.0.42
  install:
    createNamespace: true
  interval: 5m
  releaseName: reflector
  targetNamespace: reflector
