---
apiVersion: v1
kind: Namespace
metadata:
  name: keda-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kedacore
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/kedacore/keda
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda-system
spec:
  chart:
    spec:
      chart: keda
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
      version: 2.17.3
  install:
    createNamespace: true
  interval: 5m
  releaseName: keda
  targetNamespace: keda-system
  values:
    resources:
      metricServer:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi
      operator:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi
      webhooks:
        limits:
          cpu: 250m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 128Mi
