              source: |
                .parsed = parse_syslog!(.message)
                .host = .parsed.host
                .cluster = ""
                .tenant_namespace = ""
                .environment = ""
                .provider_type = ""
              type: remap
        env:
        - name: VECTOR_WATCH_CONFIG
          value: "true"
        - name: VECTOR_INTERNAL_LOG_RATE_LIMIT
          value: "300"
        extraVolumeMounts:
        - mountPath: /etc/vector/kafka-tls
