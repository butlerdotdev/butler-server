- APIVersion: helm.toolkit.fluxcd.io/v2
  IsNamespaced: true
  Kind: HelmRelease
  Name: vector
  Namespace: vector
  Object:
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: vector
      namespace: vector
    spec:
      chart:
        spec:
          chart: vector
          reconcileStrategy: ChartVersion
          sourceRef:
            kind: HelmRepository
            name: vector-repo
            namespace: flux-system
          version: ~0.52.0
      dependsOn:
      - name: kube-prometheus-stack
        namespace: observability
      install:
        createNamespace: true
        remediation:
          retries: 3
      interval: 1h0m0s
      releaseName: vector
      timeout: 30m
      upgrade:
        remediation:
          retries: 3
      values:
        autoscaling:
          enabled: false
          external: true
          maxReplicas: 20
          minReplicas: 5
        containerPorts:
        - containerPort: 8686
          name: api
          protocol: TCP
        - containerPort: 9000
          name: prometheus
          protocol: TCP
        - containerPort: 9162
          name: snmp
          protocol: TCP
        - containerPort: 9601
          name: syslog
          protocol: TCP
        - containerPort: 9602
          name: syslog-udp
          protocol: UDP
        - containerPort: 8080
          name: http-source
          protocol: TCP
        - containerPort: 4317
          name: otlp-grpc
          protocol: TCP
        - containerPort: 4318
          name: otlp-http
          protocol: TCP
        - containerPort: 9598
          name: prom-exporter
          protocol: TCP
        customConfig:
          api:
            address: 0.0.0.0:8686
            enabled: true
          data_dir: /vector-data-dir
          sinks:
            loki_app_logs:
              buffer:
                max_size: 4294967296
                type: disk
                when_full: block
              encoding:
                codec: json
              endpoint: https://loki-crop-prd.phibred.com
              inputs:
              - filter_logs
              - remap_self_logs
              - kafka_logs
              labels:
                cluster: '{{ `{{cluster}}` }}'
                env: prd
                environment: '{{ `{{environment}}` }}'
