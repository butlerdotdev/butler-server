          readOnly: true
        - mountPath: /etc/vector/otlp-tls
          name: otlp-tls
          readOnly: true
        extraVolumes:
        - name: kafka-tls
          secret:
            defaultMode: 256
            secretName: vector-consumer
        - name: otlp-tls
          secret:
            defaultMode: 256
            secretName: vector-otlp-tls
        image:
          pullPolicy: IfNotPresent
          repository: timberio/vector
          tag: 0.55.0-alpine
        persistence:
          enabled: true
          size: 20Gi
          storageClassName: longhorn
        podLabels:
          vector.dev/exclude: "false"
        podMonitor:
          enabled: true
        podSecurityContext:
          fsGroup: 65534
          runAsNonRoot: true
        readinessProbe:
          failureThreshold: 6
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: http-source
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 4000m
            memory: 8Gi
          requests:
            cpu: 2000m
            memory: 4Gi
        role: Aggregator
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
        service:
          enabled: true
          ports:
          - name: prometheus
            port: 9000
            protocol: TCP
            targetPort: prometheus
          - name: snmp
            port: 9162
            protocol: TCP
            targetPort: snmp
          - name: syslog
            port: 9601
            protocol: TCP
            targetPort: syslog
          - name: syslog-udp
            port: 9602
            protocol: UDP
            targetPort: syslog-udp
          - name: http-source
            port: 8080
            protocol: TCP
            targetPort: http-source
          - name: otlp-grpc
            port: 4317
            protocol: TCP
            targetPort: otlp-grpc
          - name: otlp-http
            port: 4318
            protocol: TCP
            targetPort: otlp-http
          type: LoadBalancer
