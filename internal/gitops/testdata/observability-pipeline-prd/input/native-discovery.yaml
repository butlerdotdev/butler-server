- APIVersion: kafka.strimzi.io/v1
  IsNamespaced: true
  Kind: Kafka
  Name: pipeline-kafka
  Namespace: kafka
  Object:
    apiVersion: kafka.strimzi.io/v1
    kind: Kafka
    metadata:
      annotations:
        strimzi.io/kraft: enabled
        strimzi.io/node-pools: enabled
      name: pipeline-kafka
      namespace: kafka
    spec:
      entityOperator:
        topicOperator: {}
        userOperator: {}
      kafka:
        authorization:
          superUsers:
          - CN=cluster-operator,O=io.strimzi
          - CN=pipeline-kafka-entity-topic-operator,O=io.strimzi
          - CN=pipeline-kafka-entity-user-operator,O=io.strimzi
          type: simple
        config:
          auto.create.topics.enable: false
          default.replication.factor: 3
          min.insync.replicas: 2
          num.partitions: 32
          offsets.topic.replication.factor: 3
          transaction.state.log.min.isr: 2
          transaction.state.log.replication.factor: 3
        listeners:
        - authentication:
            type: tls
          name: internal
          port: 9092
          tls: true
          type: internal
        - authentication:
            type: tls
          name: external
          port: 9094
          tls: true
          type: loadbalancer
        metadataVersion: 4.1-IV0
        version: 4.1.2
- APIVersion: kafka.strimzi.io/v1
  IsNamespaced: true
  Kind: KafkaNodePool
  Name: dual-role
  Namespace: kafka
  Object:
    apiVersion: kafka.strimzi.io/v1
    kind: KafkaNodePool
    metadata:
      labels:
        strimzi.io/cluster: pipeline-kafka
      name: dual-role
      namespace: kafka
    spec:
      jvmOptions:
        -Xms: 12g
        -Xmx: 12g
      replicas: 3
      resources:
        limits:
          cpu: 8
          memory: 24Gi
        requests:
          cpu: 4
          memory: 16Gi
      roles:
      - controller
      - broker
      storage:
        type: jbod
        volumes:
        - class: longhorn
          deleteClaim: false
          id: 0
          size: 750Gi
          type: persistent-claim
      template:
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: node-pool
                    operator: In
                    values:
                    - kafka-pool
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                  - key: strimzi.io/cluster
                    operator: In
                    values:
                    - pipeline-kafka
                  - key: strimzi.io/pool-name
                    operator: In
                    values:
                    - dual-role
                topologyKey: kubernetes.io/hostname
          tolerations:
          - effect: NoSchedule
            key: workload
            value: kafka
