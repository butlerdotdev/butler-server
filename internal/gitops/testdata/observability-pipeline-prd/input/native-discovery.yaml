  - APIVersion: helm.toolkit.fluxcd.io/v2
    IsNamespaced: true
    Kind: HelmRelease
    Name: kube-prometheus-stack
    Namespace: observability
    Object:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kube-prometheus-stack
        namespace: observability
      spec:
        chart:
          spec:
            chart: kube-prometheus-stack
            reconcileStrategy: ChartVersion
            sourceRef:
              kind: HelmRepository
              name: prometheus-community
              namespace: flux-system
            version: ~67.0.0
        install:
