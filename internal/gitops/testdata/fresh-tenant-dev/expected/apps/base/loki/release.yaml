apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  chart:
    spec:
      chart: loki
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: '*'
  install:
    createNamespace: true
  interval: 5m
  releaseName: loki
  targetNamespace: loki
