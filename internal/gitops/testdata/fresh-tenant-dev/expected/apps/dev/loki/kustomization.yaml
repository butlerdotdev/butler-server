apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
patches:
- path: loki-values.yaml
  target:
    kind: HelmRelease
    name: loki
resources:
- ingressroute-loki-loki-gateway.yaml
- sealedsecret-loki-loki-gateway-tls.yaml
- sealedsecret-loki-seaweedfs-s3-credentials.yaml
- service-loki-loki-gateway-lb.yaml
- ../../base/loki
